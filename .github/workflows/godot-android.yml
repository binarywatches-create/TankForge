name: TankForge 2.5D Android APK

on:
  push:
    branches: [ 'prototype/**' ]
    paths:
      - 'godot-prototype/**'
      - '.github/workflows/godot-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform and build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false

      - name: Install Godot export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -O /tmp/godot-templates.tpz
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"

      - name: Configure Godot Android SDK paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Configure Android debug signing
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("godot-prototype/export_presets.cfg")
          s = p.read_text()
          s = s.replace('keystore/debug=""', 'keystore/debug="' + str(Path.home() / ".android/debug.keystore") + '"')
          s = s.replace('keystore/debug_user=""', 'keystore/debug_user="androiddebugkey"')
          s = s.replace('keystore/debug_password=""', 'keystore/debug_password="android"')
          p.write_text(s)
          PY
          grep -E '^keystore/debug' godot-prototype/export_presets.cfg

      - name: Validate project
        run: godot --headless --path godot-prototype --editor --quit

      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless --path godot-prototype --export-debug "Android" build/TankForge-2.5D-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TankForge-2.5D-debug-apk
          path: build/TankForge-2.5D-debug.apk
          if-no-files-found: error
          retention-days: 14
